services:
  - type: web
    name: games-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python games_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GAME_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
